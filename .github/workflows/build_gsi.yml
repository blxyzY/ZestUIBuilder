name: ZestUIBuilder

on:
    workflow_dispatch:
        inputs:
            ROM_URL:
                description: 'ROM_URL'
                required: true
                default: ''
jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
        - name: Download & Patch
          run: |
                #sudo apt update && sudo apt install unace unrar zip unzip p7zip-full p7zip-rar sharutils rar uudeview mpack arj cabextract rename liblzma-dev python-pip brotli lz4 protobuf-compiler git gawk
                git clone https://github.com/blxyzY/ZestUIBuilder && cd ZestUIGSITool
                mkdir -p DownloadedROMs
                mkdir -p UnpackedROMs
                mkdir -p UnpackedROMs/system                
                sudo bash LinkToGSI.sh ${{github.event.inputs.ROM_URL}} Pixel
                7z a -v500m -tzip ZestUIBuilder.zip Output/*.img
        - name: Upload to Release
          uses: softprops/action-gh-release@v1
          with:
            files: | 
              ZestUIGSITool/ZestUIGSIROM.*
              ZestUIGSITool/Output/ZestUIGSIROM.*
            name: ZestUIGSI-${{ github.run_id }}
            tag_name: ${{ github.run_id }}
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
