name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y jq

      # --- Replace this block with your actual build steps ---
      - name: Build
        run: |
          echo "TODO: put your real build commands here"
          # e.g.: make build   -> should produce something like output.img

      - name: Make scripts executable
        run: chmod +x release.sh upload.sh

      - name: Upload build result to GoFile
        env:
          GOFILE_TOKEN: ${{ secrets.GOFILE_TOKEN }}
        run: ./release.sh

      - name: Summary
        run: echo "Done. See the 'Upload build result to GoFile' step logs for the download link."